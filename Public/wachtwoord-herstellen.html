<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f1f8f6"><title>Nieuw wachtwoord — Discuswereld</title><link rel="stylesheet" href="site.css"></head>
<body><header class="topbar"><nav class="nav wrap"><a class="brand" href="index.html"><b>◉</b>Discuswereld</a><details class="nav-menu"><summary>Menu</summary><div class="nav-menu-items"><a href="index.html">Home</a><a href="community.html">Community</a><a href="discussieruimte.html">Discussieruimte</a></div></details></nav></header>
<section class="hero"><div class="wrap"><div class="crumb"><a href="index.html">Home</a> / Wachtwoord herstellen</div><div class="eyebrow">Accountbeveiliging</div><h1>Kies een nieuw wachtwoord.</h1><p>Gebruik deze pagina via de link in de herstelmail.</p></div></section>
<main><div class="wrap" style="max-width:620px"><section class="form-card"><div id="reset-status" class="status" role="status" aria-live="polite">Herstellink controleren…</div><form id="reset-form" hidden><label for="new-password">Nieuw wachtwoord</label><input id="new-password" type="password" autocomplete="new-password" minlength="8" required><label for="confirm-password">Herhaal nieuw wachtwoord</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="8" required><button class="button" type="submit">Wachtwoord opslaan</button></form></section></div></main>
<script src="community-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const cfg=window.DISCUS_SUPABASE_CONFIG||{},status=document.getElementById('reset-status'),form=document.getElementById('reset-form');if(!window.supabase||!cfg.url||!cfg.anonKey){status.textContent='Wachtwoordherstel is tijdelijk niet beschikbaar.';return}const client=window.supabase.createClient(cfg.url,cfg.anonKey);let recovery=false;client.auth.onAuthStateChange(event=>{if(event==='PASSWORD_RECOVERY'){recovery=true;form.hidden=false;status.textContent='Kies een nieuw wachtwoord.'}});client.auth.getSession().then(({data,error})=>{if(error){status.textContent='De herstellink is ongeldig of verlopen. Vraag een nieuwe link aan.';return}if(data.session){recovery=true;form.hidden=false;status.textContent='Kies een nieuw wachtwoord.'}else if(!recovery)status.textContent='De herstellink is ongeldig of verlopen. Vraag een nieuwe link aan via de discussieruimte.'});form.addEventListener('submit',async event=>{event.preventDefault();const password=document.getElementById('new-password').value;if(password!==document.getElementById('confirm-password').value){status.textContent='De wachtwoorden komen niet overeen.';return}const{error}=await client.auth.updateUser({password});if(error){status.textContent='Het wachtwoord kon niet worden gewijzigd. Vraag een nieuwe herstellink aan.';status.classList.add('error');return}status.classList.remove('error');status.textContent='Je wachtwoord is gewijzigd. Je kunt nu inloggen in de discussieruimte.';form.hidden=true})})();
</script></body></html>
