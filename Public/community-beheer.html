<!DOCTYPE html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="Beveiligd beheer van toegangsaanvragen voor de Discuswereld-community."><meta name="theme-color" content="#f1f8f6"><title>Aanvragen beheren — Discuswereld</title><link rel="stylesheet" href="site.css"><style>.request-list{display:grid;gap:14px}.request-card{padding:18px;background:#fff;border:1px solid var(--line);border-radius:8px}.request-head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.request-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.request-card p{white-space:pre-wrap;overflow-wrap:anywhere}.status:empty{display:none}.admin-panel[hidden],.login-panel[hidden]{display:none!important}.access-trap{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}</style></head>
<body><header class="topbar"><nav class="nav wrap"><a class="brand" href="index.html"><b>◉</b>Discuswereld</a><details class="nav-menu"><summary>Menu</summary><div class="nav-menu-items"><a href="index.html">Home</a><a href="community.html">Community</a><a href="discussieruimte.html">Discussieruimte</a><a href="community-beheer.html">Aanvragen beheren</a></div></details></nav></header><section class="hero"><div class="wrap"><div class="crumb"><a href="index.html">Home</a> / <a href="community.html">Community</a> / Beheer</div><div class="eyebrow">Alleen moderators</div><h1>Toegangsaanvragen beheren.</h1><p>Log in met een goedgekeurd moderatoraccount om aanvragen te beoordelen.</p></div></section><main><div class="wrap"><section class="login-panel panel" id="login-panel"><h2>Moderator inloggen</h2><div id="auth-status" class="status" role="status" aria-live="polite"></div><form id="login-form" class="form-card"><label for="email">E-mailadres</label><input id="email" type="email" autocomplete="username" required><label for="password">Wachtwoord</label><input id="password" type="password" autocomplete="current-password" required><button class="button" type="submit">Inloggen</button></form></section><section id="admin-panel" class="admin-panel" hidden><div class="request-head"><div><h2>Open aanvragen</h2><p id="signed-in" class="small"></p></div><button id="refresh" class="button" type="button">Vernieuwen</button></div><div id="admin-status" class="status" role="status" aria-live="polite"></div><div id="requests" class="request-list"></div><button id="logout" class="button" type="button">Uitloggen</button></section></div></main><footer><div class="foot wrap"><a href="community.html">← Terug naar community</a></div></footer><script src="community-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(()=>{const $=id=>document.getElementById(id),cfg=window.DISCUS_SUPABASE_CONFIG||{},loginPanel=$('login-panel'),adminPanel=$('admin-panel'),authStatus=$('auth-status'),adminStatus=$('admin-status');let client=null,user=null,profile=null;if(window.supabase&&cfg.url&&cfg.anonKey&&!cfg.url.includes('YOUR_')&&!cfg.anonKey.includes('YOUR_'))client=window.supabase.createClient(cfg.url,cfg.anonKey);function say(el,text,error=false){el.textContent=text;el.classList.toggle('error',error)}function el(tag,cls,value){const n=document.createElement(tag);if(cls)n.className=cls;n.textContent=String(value??'');return n}async function session(s){user=s?.user||null;if(!user){profile=null;adminPanel.hidden=true;loginPanel.hidden=false;return}const{data,error}=await client.from('community_profiles').select('display_name,is_approved,is_moderator').eq('id',user.id).maybeSingle();if(error||!data?.is_approved||!data?.is_moderator){await client.auth.signOut();say(authStatus,'Alleen goedgekeurde moderators kunnen aanvragen beheren.',true);return}profile=data;loginPanel.hidden=true;adminPanel.hidden=false;$('signed-in').textContent='Ingelogd als moderator: '+(data.display_name||user.email);await load()}async function load(){say(adminStatus,'Aanvragen laden…');$('requests').replaceChildren();const{data,error}=await client.from('community_access_requests').select('id,full_name,email,interests,status,created_at').eq('status','pending').order('created_at',{ascending:true});if(error){say(adminStatus,'Aanvragen konden niet worden geladen. Controleer de database-instellingen.',true);return}if(!data?.length){say(adminStatus,'Er zijn geen openstaande aanvragen.');return}say(adminStatus,data.length+' openstaande aanvraag/aanvragen.');for(const r of data){const card=el('article','request-card',''),head=el('div','request-head','');head.append(el('strong','',r.full_name),el('time','small',new Date(r.created_at).toLocaleString('nl-NL')));const email=el('p','',r.email);const interests=el('p','',r.interests||'Geen toelichting opgegeven.');const actions=el('div','request-actions','');for(const [label,status] of [['Goedkeuren','approved'],['Afwijzen','rejected']]){const b=el('button','button',label);b.type='button';b.addEventListener('click',()=>review(r.id,status,b));actions.append(b)}card.append(head,email,interests,actions);$('requests').append(card)}}async function review(id,status,button){button.disabled=true;const{error}=await client.from('community_access_requests').update({status,reviewed_at:new Date().toISOString(),reviewed_by:user.id}).eq('id',id);button.disabled=false;if(error){say(adminStatus,'De aanvraag kon niet worden bijgewerkt.',true);return}say(adminStatus,status==='approved'?'Aanvraag goedgekeurd. Maak/invite daarna het account in Supabase Auth en keur het profiel apart goed.':'Aanvraag afgewezen.');await load()}if(!client){say(authStatus,'Beheer is tijdelijk niet beschikbaar.',true);$('login-form').querySelector('button').disabled=true}else{client.auth.getSession().then(({data})=>session(data.session));client.auth.onAuthStateChange((_event,s)=>setTimeout(()=>session(s),0))}$('login-form').addEventListener('submit',async e=>{e.preventDefault();if(!client)return;say(authStatus,'Bezig met inloggen…');const{error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)say(authStatus,'Inloggen is niet gelukt.',true)});$('refresh').addEventListener('click',load);$('logout').addEventListener('click',()=>client?.auth.signOut())})();
</script></body></html>
